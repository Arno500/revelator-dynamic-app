name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint, test & build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build (release)
        run: cargo build --release --workspace --locked

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: revelator-control-${{ github.sha }}
          path: |
            target/release/revelator-gui.exe
            target/release/revelator-cli.exe

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches the Cargo version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'revelator-gui' | Select-Object -ExpandProperty version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match workspace version v$version (Cargo.toml)"
            exit 1
          }

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Package
        shell: pwsh
        run: |
          $name = "revelator-control-$env:GITHUB_REF_NAME-windows-x64"
          New-Item -ItemType Directory -Force dist/$name | Out-Null
          Copy-Item target/release/revelator-gui.exe, target/release/revelator-cli.exe, README.md dist/$name/
          Compress-Archive -Path dist/$name/* -DestinationPath dist/$name.zip
          Copy-Item target/release/revelator-gui.exe dist/
          Copy-Item target/release/revelator-cli.exe dist/
          $sums = Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $sums | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghArgs = @('release', 'create', $env:GITHUB_REF_NAME, '--title', $env:GITHUB_REF_NAME, '--generate-notes', '--verify-tag')
          if ($env:GITHUB_REF_NAME -match '-') { $ghArgs += '--prerelease' }
          $ghArgs += Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh @ghArgs
